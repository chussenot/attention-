name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Family B bundle check reads the pinned pre-registration commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo run --example run_scenarios
        run: cargo run --example run_scenarios
      - name: P2 baseline sanity checks (development data only)
        run: cargo run --release --example p2 -- sanity
      - name: Family B author bundle (standalone build and leakage scan)
        run: scripts/check-family-b-bundle.sh
